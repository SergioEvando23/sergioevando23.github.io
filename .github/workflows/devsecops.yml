name: DevSecOps pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_test:
    name: Build, tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate:i18n
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage/lcov.info
          retention-days: 7

  sonar:
    name: Sonar quality gate
    needs: build_test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: coverage-${{ github.sha }}
          path: coverage
      - uses: actions/checkout@v4
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
      - uses: SonarSource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependency_audit:
    name: Dependency validation
    needs: sonar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  codeql:
    name: CodeQL
    needs: dependency_audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  deploy_development:
    name: Deploy DSV
    if: github.event_name != 'pull_request'
    needs: codeql
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out
      - name: Deploy validated artifact
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: development
      - run: curl --fail --retry 5 --retry-delay 5 --max-time 60 "$DSV_URL"
        env:
          DSV_URL: ${{ vars.DEPLOY_URL }}

  deploy_homologation:
    name: Deploy HML
    if: github.event_name != 'pull_request'
    needs: deploy_development
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ vars.FIREBASE_PROJECT_ID }}
          target: homologation
      - run: curl --fail --retry 5 --retry-delay 5 --max-time 60 "$HML_URL"
        env:
          HML_URL: ${{ vars.DEPLOY_URL }}

  e2e_homologation:
    name: E2E against HML
    if: github.event_name != 'pull_request'
    needs: deploy_homologation
    runs-on: ubuntu-latest
    environment: homologation
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ vars.DEPLOY_URL }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.sha }}
          path: playwright-report
          retention-days: 7

  deploy_production:
    name: Deploy production
    if: github.event_name != 'pull_request'
    needs: e2e_homologation
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: static-site-${{ github.sha }}
          path: out
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - uses: actions/deploy-pages@v4
